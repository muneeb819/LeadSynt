# LeadSynt — reference nginx config (production edge)
# Only this edge is internet-facing; API/DB/Redis stay internal.

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

upstream frontend { server 127.0.0.1:3000; }
upstream api      { server 127.0.0.1:8000; }

server {
    listen 443 ssl;
    http2 on;
    server_name app.leadsynt.example;

    ssl_certificate     /etc/ssl/leadsynt/fullchain.pem;
    ssl_certificate_key /etc/ssl/leadsynt/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # SPA + API proxy (same-origin, so the browser only ever sees this host)
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name app.leadsynt.example;
    return 301 https://$host$request_uri;
}
