name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # Lint is surfaced in CI but intentionally non-blocking for now:
      # tightening it to a hard gate is a follow-up (see README roadmap).
      - name: Lint (ruff)
        working-directory: backend
        continue-on-error: true
        run: ruff check app

      - name: Backend tests (pytest, isolated SQLite)
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend — Next.js build (TS strict gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Next.js)
        working-directory: frontend
        run: npm run build